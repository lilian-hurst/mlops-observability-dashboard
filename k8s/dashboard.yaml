apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard }
  template:
    metadata:
      labels: { app: dashboard }
    spec:
      containers:
        - name: dashboard
          image: mlops-dashboard:local  # construit depuis ../Dockerfile.dashboard -- voir k8s/README.md
          ports: [{ containerPort: 8501 }]
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: ClusterIP
  selector: { app: dashboard }
  ports: [{ port: 8501, targetPort: 8501 }]
